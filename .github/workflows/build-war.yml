# build-war.yml
# 在 GitHub 上把 CFM56 涡扇发动机三维体验打包成可部署的 WAR。
# 打包逻辑已内联（不再依赖仓库内的 build-war.ps1），在 Windows runner 上用
# PowerShell 完成，产物作为 Artifact 上传；推送 v* tag 时额外发布为 Release。
#
# 触发方式:
#   - 推送到 master 分支
#   - 推送 v* 标签（生成 Release）
#   - 手动 workflow_dispatch（可指定部署上下文名，默认 cfm56）

name: Build WAR

on:
  push:
    branches: [master]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      name:
        description: '部署上下文名（cfm56 -> /cfm56，ROOT -> 根应用）'
        required: false
        default: 'cfm56'

permissions:
  contents: write   # 仅 tag 发布 Release 时需要

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build WAR
        shell: pwsh
        env:
          WAR_NAME: ${{ github.event.inputs.name || 'cfm56' }}
        run: |
          $ErrorActionPreference = 'Stop'
          $name = $env:WAR_NAME
          if ([string]::IsNullOrWhiteSpace($name)) { $name = 'cfm56' }
          $root   = $env:GITHUB_WORKSPACE
          $stage  = Join-Path $root '.war-stage'
          $warName = "$name.war"
          $warPath = Join-Path $root $warName

          if (Test-Path $stage)  { Remove-Item $stage  -Recurse -Force }
          if (Test-Path $warPath) { Remove-Item $warPath -Force }
          New-Item $stage -ItemType Directory | Out-Null

          $include = @('index.html', 'script.js', 'styles.css', 'plane.obj', 'plane.mtl', 'sky.hdr')
          foreach ($f in $include) {
            $src = Join-Path $root $f
            if (-not (Test-Path $src)) { throw "缺少必需文件: $f" }
            Copy-Item $src (Join-Path $stage $f)
          }

          $webInf = Join-Path $stage 'WEB-INF'
          New-Item $webInf -ItemType Directory | Out-Null
          Copy-Item (Join-Path $root 'WEB-INF/web.xml') $webInf

          # WAR 本质是 ZIP，Tomcat 可直接识别；Compress-Archive 只接受 .zip，
          # 先生成临时 zip 再重命名为 .war。
          $zipPath = Join-Path $root '.cfm56-tmp.zip'
          if (Test-Path $zipPath) { Remove-Item $zipPath -Force }
          Compress-Archive -Path (Join-Path $stage '*') -DestinationPath $zipPath -Force
          Move-Item $zipPath $warPath -Force
          Remove-Item $stage -Recurse -Force

          $size = [math]::Round((Get-Item $warPath).Length / 1KB, 1)
          Write-Host "已生成 $warPath ($size KB)"
          $ctx = if ($name -eq 'ROOT') { '' } else { $name }
          Write-Host "上下文路径: /$ctx"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: war-${{ github.event.inputs.name || 'cfm56' }}
          path: '*.war'
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build WAR for release
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root   = $env:GITHUB_WORKSPACE
          $stage  = Join-Path $root '.war-stage'
          $warName = 'cfm56.war'
          $warPath = Join-Path $root $warName
          if (Test-Path $stage)  { Remove-Item $stage  -Recurse -Force }
          if (Test-Path $warPath) { Remove-Item $warPath -Force }
          New-Item $stage -ItemType Directory | Out-Null
          $include = @('index.html', 'script.js', 'styles.css', 'plane.obj', 'plane.mtl', 'sky.hdr')
          foreach ($f in $include) {
            $src = Join-Path $root $f
            if (-not (Test-Path $src)) { throw "缺少必需文件: $f" }
            Copy-Item $src (Join-Path $stage $f)
          }
          $webInf = Join-Path $stage 'WEB-INF'
          New-Item $webInf -ItemType Directory | Out-Null
          Copy-Item (Join-Path $root 'WEB-INF/web.xml') $webInf
          $zipPath = Join-Path $root '.cfm56-tmp.zip'
          if (Test-Path $zipPath) { Remove-Item $zipPath -Force }
          Compress-Archive -Path (Join-Path $stage '*') -DestinationPath $zipPath -Force
          Move-Item $zipPath $warPath -Force
          Remove-Item $stage -Recurse -Force
          $size = [math]::Round((Get-Item $warPath).Length / 1KB, 1)
          Write-Host "已生成 $warPath ($size KB)"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: '*.war'
          generate_release_notes: true
